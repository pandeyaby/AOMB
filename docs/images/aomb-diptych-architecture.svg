<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" role="img" aria-labelledby="title desc">
  <title id="title">AOMB breed/score loop to fixtures to DIPTYCH paired probes</title>
  <desc id="desc">AOMB emits fixtures from the breed and score loop. DIPTYCH grades paired probes for 2-safety calibration. Products stay separate; companion layer only. aomb equals green requires gate_axis_mutate.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f7f5"/>
      <stop offset="100%" stop-color="#e8eef2"/>
    </linearGradient>
    <linearGradient id="aombFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f4d3a"/>
      <stop offset="100%" stop-color="#16382b"/>
    </linearGradient>
    <linearGradient id="dipFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#152a45"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 Z" fill="#4a5560"/>
    </marker>
  </defs>

  <rect width="920" height="320" rx="12" fill="url(#bg)"/>

  <!-- AOMB lane -->
  <rect x="28" y="36" width="360" height="248" rx="14" fill="#ffffff" stroke="#1f4d3a" stroke-width="2"/>
  <rect x="28" y="36" width="360" height="42" rx="14" fill="url(#aombFill)"/>
  <rect x="28" y="56" width="360" height="22" fill="url(#aombFill)"/>
  <text x="208" y="63" text-anchor="middle" fill="#f5faf7" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700">AOMB  emit</text>

  <rect x="56" y="100" width="304" height="70" rx="10" fill="#eef5f1" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="208" y="130" text-anchor="middle" fill="#16382b" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700">breed / score loop</text>
  <text x="208" y="152" text-anchor="middle" fill="#3d5248" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">train.py · val_bpb · agent loop</text>

  <path d="M208 170 v22" stroke="#4a5560" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="56" y="200" width="304" height="62" rx="10" fill="#eef5f1" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="208" y="226" text-anchor="middle" fill="#16382b" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700">fixtures</text>
  <text x="208" y="246" text-anchor="middle" fill="#3d5248" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">diptych-probes/ · public ranking card</text>

  <!-- Arrow between products -->
  <path d="M388 231 H448" stroke="#4a5560" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="418" y="218" text-anchor="middle" fill="#4a5560" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">emit ’</text>

  <!-- DIPTYCH lane -->
  <rect x="448" y="36" width="444" height="248" rx="14" fill="#ffffff" stroke="#1e3a5f" stroke-width="2"/>
  <rect x="448" y="36" width="444" height="42" rx="14" fill="url(#dipFill)"/>
  <rect x="448" y="56" width="444" height="22" fill="url(#dipFill)"/>
  <text x="670" y="63" text-anchor="middle" fill="#f4f7fb" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700">DIPTYCH  grade (companion)</text>

  <rect x="476" y="100" width="388" height="62" rx="10" fill="#eef2f7" stroke="#2c5282" stroke-width="1.5"/>
  <text x="670" y="126" text-anchor="middle" fill="#152a45" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700">paired probes</text>
  <text x="670" y="146" text-anchor="middle" fill="#3d4a5c" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">conforming × violating · diptych_schema 0.2</text>

  <path d="M670 162 v20" stroke="#4a5560" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="476" y="190" width="388" height="72" rx="10" fill="#eef2f7" stroke="#2c5282" stroke-width="1.5"/>
  <text x="670" y="216" text-anchor="middle" fill="#152a45" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700">2-safety / calibration</text>
  <text x="670" y="236" text-anchor="middle" fill="#3d4a5c" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">full-8 gate + gate_axis_mutate</text>
  <text x="670" y="254" text-anchor="middle" fill="#1e3a5f" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">aomb=green requires axis_power</text>

  <!-- Footer note -->
  <text x="460" y="308" text-anchor="middle" fill="#5a6570" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Do not merge products  AOMB emits; DIPTYCH grades. Companion layer only.</text>
</svg>
