[project]
name = "aomb"
version = "0.1.0"
description = "Autonomous Observability Model Breeder — an AI agent that trains a small language model on observability telemetry overnight; surprise becomes the anomaly signal"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    "requests>=2.32.0",
    "rustbpe>=0.1.0",
    "tiktoken>=0.11.0",
    "torch==2.6.0",
    "zstandard>=0.25.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
