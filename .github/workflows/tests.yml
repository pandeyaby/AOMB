# Full test suite on every push and pull request.
# The other workflows are path-filtered and run a few test modules each, so
# before this one about half the suite (including the val_bpb integrity and
# agent-objective isolation tests) never ran in CI.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install "matplotlib>=3.10.8" "numpy>=2.2.6" "pandas>=2.3.3" "pyarrow>=21.0.0" \
            "requests>=2.32.0" "rustbpe>=0.1.0" "tiktoken>=0.11.0" "zstandard>=0.25.0" "pytest>=8.0"
      - name: pytest
        run: python -m pytest -q
