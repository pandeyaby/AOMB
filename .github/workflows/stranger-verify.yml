# Stranger verify — cite-without-cloning public gate (no MPS / no API keys)
#
# Check name (badge-friendly): stranger-verify / stranger-verify
# Default path: STRANGER_FAST=1 → full-8 + gate_axis_mutate + ranking baselines ε.
# Optional dispatch: full ranking-card --with-model on CPU torch (still not lab AUROC).
# Honesty: --auroc / --publish / --cuda invent refusals (see stranger-honesty job
# in stranger-demo.yml + tests/test_stranger_scripts.py).

name: stranger-verify

on:
  push:
    paths:
      - "scripts/stranger_verify.sh"
      - "scripts/stranger_demo.sh"
      - "scripts/run_diptych_full8.sh"
      - "scripts/run_public_ranking_card_v1.sh"
      - "docs/stranger-verify.md"
      - ".devcontainer/**"
      - "diptych-probes/**"
      - "eval/diptych/**"
      - "eval/run_public_ranking_card.py"
      - "eval/stranger_path.py"
      - "coverage/**"
      - "corpus/fixtures/public_ranking_card_v1/**"
      - "reports/public-ranking-card-v1/**"
      - "tests/test_diptych_full8.py"
      - "tests/test_public_ranking_card_v1.py"
      - "tests/test_stranger_scripts.py"
      - ".github/workflows/stranger-verify.yml"
  pull_request:
    paths:
      - "scripts/stranger_verify.sh"
      - "scripts/stranger_demo.sh"
      - "scripts/run_diptych_full8.sh"
      - "scripts/run_public_ranking_card_v1.sh"
      - "docs/stranger-verify.md"
      - ".devcontainer/**"
      - "diptych-probes/**"
      - "eval/diptych/**"
      - "eval/run_public_ranking_card.py"
      - "eval/stranger_path.py"
      - "coverage/**"
      - "corpus/fixtures/public_ranking_card_v1/**"
      - "reports/public-ranking-card-v1/**"
      - "tests/test_diptych_full8.py"
      - "tests/test_public_ranking_card_v1.py"
      - "tests/test_stranger_scripts.py"
      - ".github/workflows/stranger-verify.yml"
  workflow_dispatch:
    inputs:
      full_model:
        description: "Run full ranking-card --with-model (CPU torch; still not lab AUROC)"
        type: boolean
        default: false

jobs:
  stranger-honesty:
    name: stranger-honesty
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Honesty refusal tests (torch-free)
        run: |
          export PYTHONPATH="$PWD"
          python -m unittest tests.test_stranger_scripts -v

  stranger-verify:
    name: stranger-verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install stranger-verify deps (CPU torch only if full_model)
        run: |
          python -m pip install --upgrade pip
          pip install pyarrow rustbpe tiktoken numpy
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.full_model }}" == "true" ]]; then
            pip install torch --index-url https://download.pytorch.org/whl/cpu
            echo "STRANGER_FAST=0" >> "$GITHUB_ENV"
            echo "VERIFY_MODE=full-cpu-model" >> "$GITHUB_ENV"
          else
            echo "STRANGER_FAST=1" >> "$GITHUB_ENV"
            echo "VERIFY_MODE=fast-baselines" >> "$GITHUB_ENV"
          fi

      - name: Unit tests (diptych + ranking card harness)
        run: |
          export PYTHONPATH="$PWD"
          python -m unittest tests.test_diptych_full8 tests.test_public_ranking_card_v1 -v

      - name: Stranger verify script
        id: verify
        run: |
          chmod +x scripts/stranger_verify.sh scripts/run_diptych_full8.sh scripts/run_public_ranking_card_v1.sh
          ./scripts/stranger_verify.sh

      - name: Job summary (cite without cloning)
        if: always()
        run: |
          {
            echo "## stranger-verify"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| **Check name** | \`stranger-verify\` |"
            echo "| **Mode** | \`${VERIFY_MODE:-unknown}\` |"
            echo "| **Outcome** | ${{ job.status }} |"
            echo
            echo "### Proven (when green)"
            echo "- DIPTYCH full-8 emit + \`gate_axis_mutate\` → all \`aomb=green\`, \`axis_power=true\`"
            echo "- Public ranking card harness smoke (default: baselines-only ε; optional CPU \`--with-model\`)"
            echo "- \`--auroc\` / \`--publish\` / \`--cuda\` invent refusals (exit 1; see stranger-honesty)"
            echo
            echo "### Not claimed"
            echo "- Lab AUROC (stays \`not_published\` — no invented AUROC)"
            echo "- Production / field accuracy"
            echo "- MPS product train / overnight \`agent_loop\` (no API keys in this path)"
            echo "- CUDA (gate stays skipped)"
            echo
            echo "Docs: \`docs/stranger-verify.md\` · Codespaces: \`.devcontainer/\`"
            echo
            echo "Cite: Actions → workflow **stranger-verify** → this run URL (or the workflow badge on README)."
          } >> "$GITHUB_STEP_SUMMARY"
