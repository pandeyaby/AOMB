# Public ranking card v1 — CI baselines only
#
# Runs length + events baselines on the synthetic public fixture.
# No model train, no MPS overnight, no API spend.
# claim_status=not_published.

name: public-ranking-card-v1

on:
  push:
    paths:
      - "corpus/fixtures/public_ranking_card_v1/**"
      - "eval/**"
      - "scripts/run_public_ranking_card_v1.sh"
      - "docs/public-ranking-card-v1.md"
      - "reports/public-ranking-card-v1/**"
      - ".github/workflows/public-ranking-card-v1.yml"
      - "tests/test_public_ranking_card_v1.py"
  pull_request:
    paths:
      - "corpus/fixtures/public_ranking_card_v1/**"
      - "eval/**"
      - "scripts/run_public_ranking_card_v1.sh"
      - "docs/public-ranking-card-v1.md"
      - "reports/public-ranking-card-v1/**"
      - ".github/workflows/public-ranking-card-v1.yml"
      - "tests/test_public_ranking_card_v1.py"

jobs:
  fixture-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal deps for fixture ranking
        run: |
          python -m pip install --upgrade pip
          # Fixture path needs pyarrow transitively via corpus.ingest.adapters
          pip install pyarrow

      - name: Unit tests (public ranking card + harness metrics)
        run: |
          python -m unittest tests.test_public_ranking_card_v1 tests.test_public_accuracy_eval -v

      - name: Reproduce fixture baselines + ε check
        run: |
          chmod +x scripts/run_public_ranking_card_v1.sh
          ./scripts/run_public_ranking_card_v1.sh --check-eps
