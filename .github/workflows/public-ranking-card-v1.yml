# Public ranking card v1 — CI (baselines + fixture-only model)
#
# Runs length/events on the frozen eval split and a short fixture-only
# train-then-score (5 × ~45s CPU). No CRISP download, no overnight, no API.
# prepare.py untouched.

name: public-ranking-card-v1

on:
  push:
    paths:
      - "corpus/fixtures/public_ranking_card_v1/**"
      - "eval/**"
      - "scripts/run_public_ranking_card_v1.sh"
      - "docs/public-ranking-card-v1.md"
      - "reports/public-ranking-card-v1/**"
      - ".github/workflows/public-ranking-card-v1.yml"
      - "tests/test_public_ranking_card_v1.py"
  pull_request:
    paths:
      - "corpus/fixtures/public_ranking_card_v1/**"
      - "eval/**"
      - "scripts/run_public_ranking_card_v1.sh"
      - "docs/public-ranking-card-v1.md"
      - "reports/public-ranking-card-v1/**"
      - ".github/workflows/public-ranking-card-v1.yml"
      - "tests/test_public_ranking_card_v1.py"

jobs:
  fixture-card:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps for fixture ranking + short CPU train
        run: |
          python -m pip install --upgrade pip
          # Split installs: PyPI for pyarrow/tiktoken/rustbpe; official CPU wheel index for torch only.
          pip install pyarrow rustbpe tiktoken numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Unit tests (public ranking card + harness metrics)
        run: |
          python -m unittest tests.test_public_ranking_card_v1 tests.test_public_accuracy_eval -v

      - name: Reproduce fixture card (baselines + model) + ε check
        run: |
          chmod +x scripts/run_public_ranking_card_v1.sh
          ./scripts/run_public_ranking_card_v1.sh --with-model --train-seconds 45 --seeds 0..4 --check-eps
