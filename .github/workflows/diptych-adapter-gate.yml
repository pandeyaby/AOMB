# DIPTYCH adapter gate (AOMB full-8)
#
# Deterministic fixture probes only. No MPS train. No API spend.
# Fails on: missing operator/role, stub markers, identical twins,
# asymmetric-verdict failure, TRAJSWAP/VARSCALE without crn_closed_loop,
# and gate_axis_mutate power-on-axis (aomb=green only if mutate passes).

name: diptych-adapter-gate

on:
  # Badge / main tip: always run on push to main (not path-filtered).
  push:
    branches:
      - main
  # PRs: keep path filters so unrelated docs/train PRs stay cheap.
  pull_request:
    paths:
      - "diptych-probes/**"
      - "eval/diptych/**"
      - "coverage/**"
      - "docs/paired-probes/**"
      - "scripts/run_diptych_full8.sh"
      - "tests/test_diptych_full8.py"
      - ".github/workflows/diptych-adapter-gate.yml"
  workflow_dispatch:

jobs:
  full8-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests (manifest / contrast / stub rejection)
        run: |
          export PYTHONPATH="$PWD"
          python -m unittest tests.test_diptych_full8 -v

      - name: Full-8 DIPTYCH gate + coverage matrix
        run: |
          chmod +x scripts/run_diptych_full8.sh
          ./scripts/run_diptych_full8.sh

      - name: Assert all aomb cells green (requires gate_axis_mutate / axis_power)
        run: |
          python - <<'PY'
          import json, sys
          m = json.load(open("coverage/matrix.json"))
          bad = {
              op: c for op, c in m["operators"].items()
              if c.get("aomb") != "green" or c.get("axis_power") is not True
          }
          if bad:
            print("non-green or missing axis_power (gate_axis_mutate):", bad)
            sys.exit(1)
          print("all 8 aomb cells green with axis_power=true (gate_axis_mutate)")
          PY
